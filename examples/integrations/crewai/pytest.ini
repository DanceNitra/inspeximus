[pytest]
# This example has its own environment (crewai==1.15.22, see requirements.txt), so it has its own
# pytest config: the repository's pytest.ini runs xdist, which this environment does not install.
#   pytest examples/integrations/crewai
addopts = -p no:cacheprovider
# CrewAI 1.15.22 warns about its own deprecated fields on every kickoff; they are not this example's.
filterwarnings =
    ignore::DeprecationWarning:crewai.*
