[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inspeximus"
version = "1.88.1"
description = "The self-correcting memory layer for AI agents: when a fact is corrected, Inspeximus serves the new value and resists the old one resurfacing. Zero-dependency single file + MCP server — value-ranked recall, per-type decay, consolidation, revert, and tamper-evident erasure."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["llm", "agent", "memory", "rag", "recall", "consolidation", "mcp", "embeddings", "second-brain"]
authors = [{ name = "Rastislav Drahoš (Agora)" }]
classifiers = ["Programming Language :: Python :: 3", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.urls]
# PyPI renders each of these as a link in the project sidebar. Until now they pointed only back at this
# package, so the research the design rules actually come from -- the replication ledger, the benchmark,
# the measured receipts -- was unreachable from the one high-authority page most people land on first.
Homepage = "https://dancenitra.github.io/inspeximus/"
Source = "https://github.com/DanceNitra/inspeximus"
Repository = "https://github.com/DanceNitra/inspeximus"
Changelog = "https://github.com/DanceNitra/inspeximus/blob/main/CHANGELOG.md"
Issues = "https://github.com/DanceNitra/inspeximus/issues"
"Replication ledger" = "https://dancenitra.github.io/agora/public/crucible/"
"Benchmark (RAMR)" = "https://github.com/DanceNitra/ramr"
Research = "https://dancenitra.github.io/agora/"

[project.optional-dependencies]
# Upper bound is load-bearing, not caution. mcp 2.0 removed `mcp.server.fastmcp`, which is what
# inspeximus/mcp_server.py imports, so with an unbounded `>=1.0` a fresh `pip install "inspeximus[mcp]"`
# resolved to 2.0.0 and the MCP server raised ImportError on import -- every tool, unusable. Measured in a
# clean venv on 2026-07-30; CI never saw it because the dev image already had 1.28.1 pinned by its lockfile.
# Supporting 2.x is a real port (the module was reorganised, not renamed in place) and is not attempted here.
# The FLOOR is measured too, not inherited. ">=1.0" was never a tested claim; a resolver under an older
# interpreter, a conflicting co-dependency, or a --resolution=lowest CI run can hand you mcp 1.0.0, where
# FastMCP exists but the surrounding API does not match this code -- a subtler failure than the clean
# ImportError the ceiling fixes. 1.28.1 and 1.29.0 are the versions this code has actually been imported
# and tested against.
mcp = ["mcp[cli]>=1.28,<2"]
# Agent-framework integrations (inspeximus.integrations.*) — opt-in; the core library stays zero-dependency.
langchain = ["langchain-core"]
langgraph = ["langgraph"]
llamaindex = ["llama-index-core"]
autogen = ["autogen-agentchat", "autogen-core"]
google-adk = ["google-adk"]
openai-agents = ["openai-agents"]
pydantic-ai = ["pydantic-ai"]
crewai = ["crewai"]

[project.scripts]
inspeximus = "inspeximus.cli:main"
inspeximus-mcp = "inspeximus.mcp_server:main"

[tool.setuptools]
packages = ["inspeximus", "inspeximus.integrations"]
