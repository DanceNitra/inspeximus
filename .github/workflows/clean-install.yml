name: clean install
# A new user's route, from PyPI, on the platforms our own machine cannot test: pip install
# "inspeximus[mcp]", `inspeximus install --ide claude`, then a decision written through the MCP server in
# one process must reach the SessionStart hook and a fresh MCP recall in the next.
# The control pins 3.9.5, which lost that decision between processes; it must FAIL, or the check
# measured nothing. tools/clean_install_check.py holds the logic.
# It installs from PyPI, so on a push to main it checks the RELEASED version on each platform, not the
# pushed code; the Windows job in ci.yml and one-memory.yml test the pushed code.
on:
  workflow_dispatch:
  push:
    branches: [main, ci-clean-install]
    paths:
      - ".github/workflows/clean-install.yml"
      - "tools/clean_install_check.py"
      - "inspeximus/install.py"
      - "inspeximus/install_all.py"
      - "inspeximus/claude_code.py"
      - "inspeximus/_surface.py"
      - "inspeximus/mcp_server.py"
      - "inspeximus/integrations/hermes_agent.py"
      - "docs/install/**"
jobs:
  route:
    name: ${{ matrix.os }} / ${{ matrix.case.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `uv: true` puts uvx on PATH, so the installer writes its pinned uvx launch; without it the
        # installer falls back to the venv's python. The control runs without uv: with uv, 3.9.5's
        # unpinned `uvx --from inspeximus[mcp]` resolves the newest release and passes, which is the
        # defect 3.9.7's pin closed, not a property of 3.9.5 this check could measure.
        case:
          - {name: "latest from PyPI, no uv (must pass)", version: latest, flag: "", uv: false}
          - {name: "latest from PyPI, with uv (must pass)", version: latest, flag: "", uv: true}
          - {name: "control 3.9.5, no uv (must fail)", version: "3.9.5", flag: "--expect-fail", uv: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.case.uv
        uses: astral-sh/setup-uv@v6
      - name: clean-install check
        run: python tools/clean_install_check.py ${{ matrix.case.version }} "${{ runner.temp }}/route" ${{ matrix.case.flag }}
      - name: keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-install-${{ matrix.os }}-${{ matrix.case.version }}-uv${{ matrix.case.uv }}
          path: ${{ runner.temp }}/route/result.json
          if-no-files-found: warn
