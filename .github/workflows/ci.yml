name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography pyyaml
      # The BASE environment on purpose: the core is zero-dependency and this leg proves it stays that way.
      # It is not the whole suite -- see the `integrations` job.
      - name: Run tests
        run: python -m pytest tests/ -q

  # 102 tests across 11 modules sit behind MODULE-LEVEL import guards, so in the base job a 15-test module
  # collects as ONE skip line. The suite reported "993 passed, 43 skipped" and read as healthy while the
  # local run collected 1137. Excluding them was never a decision anyone made; it was the default, and the
  # default was invisible. This job installs the optional dependencies so they actually run: 1144 pass here.
  # (The count was first reported as 155/16 -- tools/skip_census.py was over-counting; see its tests.)
  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with every optional dependency
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography numpy pyyaml
          # `google-adk>=2` is NOT redundant. Adding the mcp<2 cap changed pip's search order in this
          # nine-extra install and it settled on a valid-but-terrible solution: google-adk 1.14.1, ten
          # majors back, which has no `google.adk.cli.service_registry` -- so the job failed on an import
          # while claiming to test the integration. MEASURED: with the cap, this line alone resolves to
          # 1.14.1; with an explicit floor it resolves to 2.5.0 and mcp 1.29.0 together, so the good
          # solution existed and pip simply did not find it. Realistic installs are unaffected --
          # `.[mcp,google-adk]` gives 2.5.0 on its own. Stating the floor means a genuine conflict fails
          # LOUDLY here instead of silently testing a version no user would get.
          pip install -e ".[mcp,langgraph,langchain,llamaindex,autogen,pydantic-ai,crewai,google-adk,openai-agents]" "google-adk>=2"
          pip install haystack-ai
      - name: Run tests
        run: python -m pytest tests/ -q -rs
      - name: How much is still not running here
        if: always()
        run: python tools/skip_census.py
