name: tests
on:
  push:
    branches: [main]
  pull_request:
  # A manual run on any branch: CI on a branch without opening a pull request.
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist cryptography pyyaml
      # The BASE environment on purpose: the core is zero-dependency and this leg proves it stays that way.
      # It is not the whole suite -- see the `integrations` job.
      - name: Run tests
        run: python -m pytest tests/ -q
      # The mutation set is deselected from the default (it edits source in place, so it cannot
      # share a tree with xdist workers). Run it here explicitly and SERIALLY, or the parallel
      # default silently drops 31 tests from CI while the run stays green.
      - name: mutation set (serial)
        run: python -m pytest tests/ -n 0 -m mutation -q
      # IS THE CONCURRENT-WRITER FAILURE RARE, OR IS IT THIS PLATFORM? On 2026-09-10 attempt 1 of
      # run 34519754923 failed here with "12 of 12 records that a writer was TOLD had been written
      # are not in the store, with 2 concurrent writers", on 3.12 while 3.11 passed. Attempt 2 was
      # green with no change, so the view that reports CI (latest attempt only) erased it.
      #
      # Ten runs, pinned to two real cores locally, did NOT reproduce it, which rules out plain
      # machine starvation and leaves platform or rarity. This loop separates them: ten serial runs
      # here, on the leg that failed. A pass says rarer than 1 in 10 on this platform; a failure is
      # the reproduction, with the seed of the run that produced it.
      #
      # continue-on-error, deliberately: this step exists to MEASURE the rate, not to gate. A flake
      # hunt that turns main red is a flake hunt nobody runs twice.
      # THIS STEP MEASURED THE WRONG CONFIGURATION FOR A DAY. It ran the file ALONE and SERIALLY
      # (-n 0), and reported 10 of 10 green, which was read as "rarer than 1 in 10". But pytest.ini
      # carries `addopts = -n auto`, so on CI this test never runs alone or serially: it runs inside
      # the whole suite, under xdist, on a 2-to-4 core runner. The failures have all come from the
      # `integrations` job, which installs the extras and therefore collects 1144 tests instead of
      # 993 -- the most loaded leg of the four. A loop that removes both the parallelism and the
      # load cannot see the thing it was added to count.
      #
      # It is also not reproducible off CI. Measured 2026-09-11 across four configurations, none of
      # which lost a record: Windows/NTFS at 4 to 12 writers (0 of 288); a simulated coarse mtime at
      # 1 s and 60 s, where the change guard can separate nothing (0 of 144); WSL/ext4 pinned to two
      # cores, 37 trials (0 of 852); and the full suite under xdist on two ext4 cores, which passed.
      #
      # So this now runs the file WITH the suite's own parallelism, several times, which is the
      # configuration that actually fails. The test itself was given the field that decides between
      # the two known explanations: each writer now reports whether the inter-process lock was held.
      - name: concurrent-writer repeat, WITH the suite's parallelism (measuring a flake, does not gate)
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5; do
            echo "--- attempt $i"
            python -m pytest tests/test_concurrent_writers_do_not_lose_a_worker.py -q \
              || echo "REPRODUCED on attempt $i"
          done

  # 102 tests across 11 modules sit behind MODULE-LEVEL import guards, so in the base job a 15-test module
  # collects as ONE skip line. The suite reported "993 passed, 43 skipped" and read as healthy while the
  # local run collected 1137. Excluding them was never a decision anyone made; it was the default, and the
  # default was invisible. This job installs the optional dependencies so they actually run: 1144 pass here.
  # (The count was first reported as 155/16 -- tools/skip_census.py was over-counting; see its tests.)
  # A new user's first minute, measured on a runner that has never seen the package: a fresh venv,
  # `pip install` of this commit, then `inspeximus demo`. Fails when the demo does not pass all three
  # checks or when install plus demo take more than 60 s (tools/time_to_demo.py). Measured locally on
  # 2026-09-24: 9.95 s, of which 9.37 s is pip.
  time-to-first-success:
    name: time to first success (pip install + inspeximus demo, 60 s budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clean venv, pip install, inspeximus demo
        run: python tools/time_to_demo.py --budget 60 --out time-to-first-success.json
      - name: seconds, in the job summary
        if: always()
        run: python tools/time_to_demo.py --summary time-to-first-success.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: time-to-first-success
          path: time-to-first-success.json

  # CrewAI: the runnable example in examples/integrations/crewai, against the version it pins
  # (crewai==1.15.22). It installs that requirements file and this checkout, then runs the example's own tests.
  # The example's test fails when a different version is installed, so a green job means that version.
  example-crewai:
    name: CrewAI example (crewai==1.15.22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned framework and this checkout
        run: |
          python -m pip install --upgrade pip
          pip install -r examples/integrations/crewai/requirements.txt pytest
          pip install -e ".[crypto]"
      - name: the example's tests
        run: python -m pytest examples/integrations/crewai -q -rs -o addopts=""

  perf:
    # A REGRESSION GATE, not a benchmark -- our benchmark is RAMR. It compares WORK COUNTERS (atomic
    # writes, whole-store serializations) against perf/baseline.json, because wall-clock on a shared
    # runner is far too noisy to gate on: the same code path measured 38% apart between two local runs.
    # Counters are exact, so this is quiet until real work appears, and red the moment it does.
    # tests/test_perf_gate_can_fail.py proves it fails when the O(k^2) tombstone write is reintroduced.
    name: work counters must not grow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install pytest pytest-xdist
      - name: compare against the recorded baseline
        run: python perf/gate.py check
      - name: the gate must be able to go red
        run: python -m pytest tests/test_perf_gate_can_fail.py -q

  # THE BROWSER VERIFIER (docs/verify/) is a JavaScript copy of verify_erasure_certificate and
  # verify_bundle, and a second copy of a decision is how this repository has drifted before. Its
  # test drives the page in Chromium and requires the Python verdict on every generated document and
  # every one-byte edit. Every other job lacks a browser, so there those tests skip, one line each;
  # here VERIFIER_PAGE_REQUIRED turns a skip into a failure.
  verifier-page:
    name: browser verifier agrees with the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist cryptography playwright
          python -m playwright install --with-deps chromium
      - name: run the page against the Python verifiers
        env:
          VERIFIER_PAGE_REQUIRED: "1"
        run: python -m pytest tests/test_verifier_page.py tests/test_verifier_page_adversarial.py -n 0 -q -rs

  # THE FULL SUITE, IN FOUR PARALLEL SHARDS. One job ran all of it in 10 to 15 minutes, and a release
  # waited on it twice (here and again in release.yml). `--shard i/4` (tests/conftest.py) splits the
  # collection by measured time (tests/shard_durations.json, refreshed with tools/shard_durations.py
  # from this job's shard-times artifacts), and splits the long cited-probe group across the shards.
  # `integrations total` below proves the four green shards ran every collected test exactly once,
  # which a set of green jobs cannot say on its own.
  integrations:
    name: integrations (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with every optional dependency
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist cryptography numpy pyyaml
          # The google-adk floor that keeps this resolvable lives in pyproject.toml, not here: a second
          # copy in each pip line is how release.yml kept the bug after this file was fixed.
          # haystack is an extra now (it was installed by hand here, and only here, while
          # `pip install "inspeximus[haystack]"` failed for everyone else).
          pip install -e ".[mcp,langgraph,langchain,llamaindex,autogen,pydantic-ai,crewai,google-adk,openai-agents,haystack]"
          # The nine-extra solve settles on openai-agents 0.2.9 while a plain install gives 0.18.3, so
          # this job was certifying an adapter against a version nobody resolves -- reporting VERIFIED
          # for a row the ledger records BROKEN against the current one. Stating a floor in pyproject
          # fixed that and cost autogen_core (the joint solve dropped it), so the upgrade is done here
          # instead, after the extras, where it touches one package rather than the whole graph.
          pip install -U "openai-agents>=0.18"
          python -c "import autogen_core, agents; print('autogen_core and agents both import')"
      - name: Run tests (this shard)
        env:
          SHARD_REPORT: shard-${{ matrix.shard }}.json
          SHARD_TIMES: times-${{ matrix.shard }}.json
        run: python -m pytest tests/ -q -rs --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-report-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
      # Measured seconds per test on this runner: the input tools/shard_durations.py turns into the
      # committed durations file the shards are balanced on.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-times-${{ matrix.shard }}
          path: times-${{ matrix.shard }}.json
      # The mutation set is deselected from the default run. It edits source in place, so it runs
      # serially, once, in the shard that carries the least other work.
      - name: mutation set (serial, full environment)
        if: matrix.shard == 0
        env:
          SHARD_TIMES: mutation-times.json
        run: python -m pytest tests/ -n 0 -m mutation -q
      - uses: actions/upload-artifact@v4
        if: always() && matrix.shard == 0
        with:
          name: mutation-times
          path: mutation-times.json
      # --require-all is the point of running it HERE: this job installs every framework, so a SKIP is
      # an install failure, not an acceptable outcome. Without it a botched pip line would leave the
      # adapters unchecked and the job green. `continue-on-error` because the suite currently records
      # three adapters as BROKEN against current upstream (docs/integration_conformance.json); the
      # pytest step above is what gates, by comparing every adapter against that recorded ledger, so a
      # NEW breakage still turns the job red while a known one does not hide behind an exit code.
      - name: Integration conformance (verified / skipped / broken)
        if: always() && matrix.shard == 0
        continue-on-error: true
        run: python tools/integration_conformance.py --require-all
      - name: How much is still not running here
        if: always() && matrix.shard == 0
        run: python tools/skip_census.py

  integrations-total:
    name: integrations total
    needs: integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-report-*
          path: shard-reports
          merge-multiple: true
      - name: the four shards ran every collected test exactly once
        run: python tools/shard_total.py "shard-reports/*.json" --expect 4
