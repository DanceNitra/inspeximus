name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist cryptography pyyaml
      # The BASE environment on purpose: the core is zero-dependency and this leg proves it stays that way.
      # It is not the whole suite -- see the `integrations` job.
      - name: Run tests
        run: python -m pytest tests/ -q
      # The mutation set is deselected from the default (it edits source in place, so it cannot
      # share a tree with xdist workers). Run it here explicitly and SERIALLY, or the parallel
      # default silently drops 31 tests from CI while the run stays green.
      - name: mutation set (serial)
        run: python -m pytest tests/ -n 0 -m mutation -q

  # 102 tests across 11 modules sit behind MODULE-LEVEL import guards, so in the base job a 15-test module
  # collects as ONE skip line. The suite reported "993 passed, 43 skipped" and read as healthy while the
  # local run collected 1137. Excluding them was never a decision anyone made; it was the default, and the
  # default was invisible. This job installs the optional dependencies so they actually run: 1144 pass here.
  # (The count was first reported as 155/16 -- tools/skip_census.py was over-counting; see its tests.)
  perf:
    # A REGRESSION GATE, not a benchmark -- our benchmark is RAMR. It compares WORK COUNTERS (atomic
    # writes, whole-store serializations) against perf/baseline.json, because wall-clock on a shared
    # runner is far too noisy to gate on: the same code path measured 38% apart between two local runs.
    # Counters are exact, so this is quiet until real work appears, and red the moment it does.
    # tests/test_perf_gate_can_fail.py proves it fails when the O(k^2) tombstone write is reintroduced.
    name: work counters must not grow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install pytest pytest-xdist
      - name: compare against the recorded baseline
        run: python perf/gate.py check
      - name: the gate must be able to go red
        run: python -m pytest tests/test_perf_gate_can_fail.py -q

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with every optional dependency
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist cryptography numpy pyyaml
          # The google-adk floor that keeps this resolvable lives in pyproject.toml, not here: a second
          # copy in each pip line is how release.yml kept the bug after this file was fixed.
          # haystack is an extra now (it was installed by hand here, and only here, while
          # `pip install "inspeximus[haystack]"` failed for everyone else).
          pip install -e ".[mcp,langgraph,langchain,llamaindex,autogen,pydantic-ai,crewai,google-adk,openai-agents,haystack]"
          # The nine-extra solve settles on openai-agents 0.2.9 while a plain install gives 0.18.3, so
          # this job was certifying an adapter against a version nobody resolves -- reporting VERIFIED
          # for a row the ledger records BROKEN against the current one. Stating a floor in pyproject
          # fixed that and cost autogen_core (the joint solve dropped it), so the upgrade is done here
          # instead, after the extras, where it touches one package rather than the whole graph.
          pip install -U "openai-agents>=0.18"
          python -c "import autogen_core, agents; print('autogen_core and agents both import')"
      - name: Run tests
        run: python -m pytest tests/ -q -rs
      # --require-all is the point of running it HERE: this job installs every framework, so a SKIP is
      # an install failure, not an acceptable outcome. Without it a botched pip line would leave the
      # adapters unchecked and the job green. `continue-on-error` because the suite currently records
      # three adapters as BROKEN against current upstream (docs/integration_conformance.json); the
      # pytest step above is what gates, by comparing every adapter against that recorded ledger, so a
      # NEW breakage still turns the job red while a known one does not hide behind an exit code.
      - name: Integration conformance (verified / skipped / broken)
        if: always()
        continue-on-error: true
        run: python tools/integration_conformance.py --require-all
      - name: How much is still not running here
        if: always()
        run: python tools/skip_census.py
