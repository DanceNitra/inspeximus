name: tests
# Diagnostic only, on diag/** branches: test (3.12) of ci.yml hung at 99% in 2 of 3 runs (2026-10-21).
# Four copies of that leg; a copy still running after 25 min gets every python process's stack dumped.
on:
  workflow_dispatch:
jobs:
  hang:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist pytest-timeout cryptography pyyaml py-spy
      - name: Run tests exactly as ci.yml does, with a watchdog
        run: |
          ( sleep 1500
            echo "=== HUNG after 25 min ==="
            ps -eo pid,ppid,etimes,stat,args --forest | grep -v " ps " | head -100
            for p in $(pgrep -f "python|pytest"); do
              echo "=== py-spy dump $p ==="
              sudo env "PATH=$PATH" py-spy dump --pid $p || true
            done
            ls -la /proc/$(pgrep -of "pytest tests")/fd 2>/dev/null | head -40
          ) &
          WD=$!
          python -m pytest tests/ -q
          rc=$?
          echo "=== pytest exited rc=$rc at $(date -u +%T) ==="
          ps -eo pid,ppid,etimes,stat,args --forest | grep -v " ps " | grep -v sleep | head -40
          kill $WD 2>/dev/null || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-log-${{ matrix.copy }}
          path: pytest.log
          if-no-files-found: ignore
