name: release

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token exists anywhere, and PyPI records a
# signed attestation binding the wheel to THIS repository, THIS workflow and THIS commit. That is the
# part a user can check: `pip download inspeximus` and the provenance says where it was built, rather
# than "the maintainer says he built it from the tagged source".
#
# One-time setup on PyPI (owner, web UI — cannot be done from here):
#   https://pypi.org/manage/project/inspeximus/settings/publishing/
#   Owner: DanceNitra · Repository: inspeximus · Workflow: release.yml · Environment: pypi
# After that, publishing needs no secret at all.

# The two LangGraph wrapper distributions version independently of the core, so they publish from
# their OWN tags (langgraph-store-inspeximus-v0.1.1) while the core keeps using v*. Both live in this
# one workflow file on purpose: PyPI's Trusted Publishing binds a project to a specific WORKFLOW
# FILENAME, and all three projects are registered against release.yml. A separate file would need a
# separate registration and would fail OIDC until someone remembered that.
on:
  push:
    tags: ["v*", "langgraph-*-v*", "adk-*-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: "wrapper package to publish (leave blank for the core)"
        required: false
        type: choice
        options: ["", "langgraph-checkpoint-inspeximus", "langgraph-store-inspeximus", "adk-inspeximus"]
      mcp_registry:
        description: "publish only the MCP registry listing (uses the version in pyproject.toml)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    # Never publish something the audits have not just passed on a clean runner.
    name: audits must pass first
    # "core tags start with v, anything else is a wrapper" -- naming the langgraph prefix here meant every
    # new wrapper family had to be added in four places, and a forgotten one publishes the CORE by mistake.
    if: ${{ !inputs.package && !inputs.mcp_registry && (github.ref_type != 'tag' || startsWith(github.ref_name, 'v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python claims_audit.py --local
      - run: python governance_audit.py --local
      - name: falsification control must fail
        run: |
          if GOV_FALSIFY=1 python governance_audit.py --local --repeats 1; then
            echo "::error::falsification control passed — the audit proves nothing"; exit 1
          fi

  tests:
    # THE SUITE, on the commit being published. `audit` above says "never publish something the audits
    # have not just passed" and meant it -- but it runs claims_audit and governance_audit, not pytest.
    # The suite lives in ci.yml, which release.yml did not depend on, so the two ran side by side and
    # neither waited: 1.86.0 published to PyPI while `tests` was RED on the same commit. The wheel was
    # fine that time -- the failure was stale version strings in two registry manifests -- but that was
    # luck, not a guarantee, and RELEASING.md forbids retagging a published version to make CI green,
    # so this cannot be repaired after the fact. It has to be a dependency.
    #
    # The integrations leg specifically: the base environment skips ~100 tests behind import guards, and
    # the manifest-version assertions that caught 1.86.0 run in BOTH legs. Mirrors ci.yml's install.
    name: the test suite must pass first
    if: ${{ !inputs.package && !inputs.mcp_registry && (github.ref_type != 'tag' || startsWith(github.ref_name, 'v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with every optional dependency
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist cryptography numpy pyyaml
          pip install -e ".[mcp,langgraph,langchain,llamaindex,autogen,pydantic-ai,crewai,google-adk,openai-agents]"
          pip install haystack-ai
          # A release path with no import check will ship whatever pip called a success. On
          # 2026-08-24 the nine-extra solve settled on `autogen-core-0.0.2`, a placeholder that
          # satisfies the name and ships no module; ci.yml caught it here and this file had
          # nothing to catch it with. The pyproject floor is the real fix -- one source, every
          # install site -- and this line is what makes the next stub loud instead of silent.
          python -c "import autogen_core, agents; print('autogen_core and agents both import')"
      - run: python -m pytest tests/ -q
      # The mutation set is deselected from the default (it edits source in place). A release must
      # not ship without it: run it serially and explicitly.
      - run: python -m pytest tests/ -n 0 -m mutation -q

  build:
    name: build sdist + wheel
    # "core tags start with v, anything else is a wrapper" -- naming the langgraph prefix here meant every
    # new wrapper family had to be added in four places, and a forgotten one publishes the CORE by mistake.
    if: ${{ !inputs.package && !inputs.mcp_registry && (github.ref_type != 'tag' || startsWith(github.ref_name, 'v')) }}
    needs: [audit, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: version in the artifact must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FOUND=$(ls dist/*.whl | sed -E 's/.*inspeximus-([0-9.]+)-.*/\1/')
          echo "tag=$TAG wheel=$FOUND"
          test "$TAG" = "$FOUND"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (trusted, attested)
    # "core tags start with v, anything else is a wrapper" -- naming the langgraph prefix here meant every
    # new wrapper family had to be added in four places, and a forgotten one publishes the CORE by mistake.
    if: ${{ !inputs.package && !inputs.mcp_registry && (github.ref_type != 'tag' || startsWith(github.ref_name, 'v')) }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # the OIDC token that replaces the API key
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  # ── the LangGraph wrapper distributions ──────────────────────────────────────────────────────────
  wrapper:
    name: publish a wrapper package
    if: ${{ inputs.package || (github.ref_type == 'tag' && !startsWith(github.ref_name, 'v')) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: work out which package, from the tag or the dispatch input
        id: pick
        run: |
          if [ -n "${{ inputs.package }}" ]; then
            PKG="${{ inputs.package }}"
          else
            PKG="$(echo "${{ github.ref_name }}" | sed -E 's/-v[0-9].*$//')"
          fi
          test -d "packages/$PKG" || { echo "::error::no such package dir: packages/$PKG"; exit 1; }
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
      - run: python -m pip install --upgrade build
      - run: python -m build
        working-directory: packages/${{ steps.pick.outputs.pkg }}
      - name: the wrapper must import and re-export what it claims
        run: |
          python -m pip install packages/${{ steps.pick.outputs.pkg }}/dist/*.whl
          python packages/_check_wrapper.py "${{ steps.pick.outputs.pkg }}"
      - name: version in the artifact must match the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="$(echo '${{ github.ref_name }}' | sed -E 's/^.*-v//')"
          FOUND="$(ls packages/${{ steps.pick.outputs.pkg }}/dist/*.whl | sed -E 's/.*-([0-9][0-9.]*)-py3.*/\1/')"
          echo "tag=$TAG wheel=$FOUND"
          test "$TAG" = "$FOUND"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          packages-dir: packages/${{ steps.pick.outputs.pkg }}/dist/


  # ── the official MCP registry ────────────────────────────────────────────────────────────────────
  # The interactive `mcp-publisher login github` device flow would put a human in the loop on every
  # release. GitHub Actions OIDC authenticates as the repository owner instead, so the listing tracks the
  # releases by itself. The registry stores only METADATA and resolves the package from PyPI, so this runs
  # after the package is published and refuses to advertise a version PyPI is not serving yet.
  mcp-registry:
    name: publish the listing to the MCP registry
    # `needs: publish`, and the reason is measured rather than stylistic. This job carries a guard that
    # refuses to advertise a version PyPI is not serving, and it waits 30 x 20s for that to become true.
    # With no `needs` it started alongside `audit`/`tests` and began polling immediately, while `publish`
    # sat behind `build` behind `audit`+`tests` -- about 17 minutes. Its 10-minute window therefore
    # expired BEFORE the package was uploaded, every time, and the guard reported "PyPI never served
    # 2.0.0" about a version that had not been published yet. The guard was right and the ordering was
    # wrong. `always()` plus the result check keeps the workflow_dispatch path working, where `publish`
    # is skipped rather than run.
    needs: publish
    if: ${{ always()
      && (inputs.mcp_registry || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: server.json must name the version we just released
        run: python packages/_pin_server_json.py
      - name: install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
          chmod +x mcp-publisher
      - name: the manifest must be valid before we claim anything
        run: ./mcp-publisher validate
      - name: refuse to advertise a version PyPI is not serving
        run: |
          VERSION="$(python -c "import json;print(json.load(open('server.json'))['version'])")"
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/inspeximus/$VERSION/json" > /dev/null; then
              echo "PyPI is serving $VERSION"; exit 0
            fi
            echo "waiting for PyPI to serve $VERSION ($i/30)"; sleep 20
          done
          echo "::error::PyPI never served $VERSION; not publishing a listing that points nowhere"
          exit 1
      - name: is this version already listed?
        id: state
        run: |
          curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=inspeximus" -o reg.json || true
          python packages/_registry_state.py reg.json
      - run: ./mcp-publisher login github-oidc
        if: steps.state.outputs.already != 'true'
      - name: publish (skipped when the registry already has this exact version)
        if: steps.state.outputs.already != 'true'
        run: ./mcp-publisher publish
      - name: the version we just released must actually be listed
        run: |
          # The registry keeps every version, does NOT return them newest-first, and PAGES at 30 — so the
          # verifier follows nextCursor to the end. Reading one page meant that past 30 published versions
          # this step could not see the new one and failed every release. It polls because the index catches
          # up a little after the publish returns.
          VERSION="$(python -c "import json;print(json.load(open('server.json'))['version'])")"
          for i in $(seq 1 20); do
            if python packages/_registry_verify.py "$VERSION"; then exit 0; fi
            echo "not indexed yet ($i/20)"; sleep 15
          done
          echo "::error::published, but the registry does not list $VERSION"
          exit 1

  github-release:
    name: create the GitHub Release for this tag
    # `needs: publish`, for the same reason mcp-registry does it: a Release page that points at a
    # version PyPI is not serving is an advertisement for something nobody can install.
    #
    # WHY THIS JOB EXISTS AT ALL, measured 2026-08-25. The repository had 125 tags and 7 Releases,
    # and the newest Release object was `mnemo 1.5.0` from 2026-07-14 -- six weeks stale, under a
    # product name we had retired. So the single most prominent version signal on the repository
    # page advertised a dead project while PyPI served that day's build. Nothing was broken; the
    # workflow simply never created one, and 118 versions went by without anyone noticing, because
    # the thing that was wrong was a page none of us opens.
    needs: publish
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
      && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the only job here that needs it
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # release_notes.py reads the CHANGELOG and the tag history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag and the package must be the same version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c "import re;print(re.search(r'version\s*=\s*\"([^\"]+)\"',open('pyproject.toml').read()).group(1))")"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG but pyproject says $PKG"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
        id: v
      - name: build the notes, and refuse an empty one
        run: |
          python tools/release_notes.py > NOTES.md
          # A Release whose body is a stub is worse than none: it looks maintained and says nothing.
          test "$(wc -c < NOTES.md)" -ge 500 || { echo "::error::notes are $(wc -c < NOTES.md) bytes"; exit 1; }
          grep -q "${{ steps.v.outputs.version }}" NOTES.md || { echo "::error::notes do not name this version"; exit 1; }
      - name: create it, unless it is already there
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; leaving it alone"; exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "inspeximus ${{ steps.v.outputs.version }}" \
            --notes-file NOTES.md --verify-tag
      - name: and it must actually be the latest the API reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST="$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)"
          test "$LATEST" = "$GITHUB_REF_NAME" || {
            echo "::error::created $GITHUB_REF_NAME but the API still calls $LATEST latest"; exit 1; }
          echo "latest is now $LATEST"
