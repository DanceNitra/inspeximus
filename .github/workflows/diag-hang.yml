name: diag hang 3.12
# Diagnostic only, on diag/** branches: test (3.12) of ci.yml hung at 99% in 2 of 3 runs (2026-10-21).
# Four copies of that leg; a copy still running after 25 min gets every python process's stack dumped.
on:
  push:
    branches: ["diag/**"]
jobs:
  hang:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist pytest-timeout cryptography pyyaml py-spy
      - name: Run tests, dump stacks on a hang
        run: |
          python -m pytest tests/ --collect-only -q -p no:cacheprovider 2>/dev/null | grep '::' > collected.txt
          python -m pytest tests/ -v -p no:cacheprovider > pytest.log 2>&1 &
          PID=$!
          for i in $(seq 1 150); do
            kill -0 $PID 2>/dev/null || break
            sleep 10
          done
          if kill -0 $PID 2>/dev/null; then
            echo "=== HUNG after 25 min ==="
            tail -n 60 pytest.log
            echo "=== processes ==="
            ps -eo pid,ppid,etimes,stat,args --forest | grep -v " ps " | head -80
            for p in $(pgrep -f python); do
              echo "=== py-spy dump $p ==="
              sudo env "PATH=$PATH" py-spy dump --pid $p || true
            done
            echo "=== started but not finished ==="
            python - <<'EOF'
          import re
          started, done = {}, set()
          for line in open("pytest.log", errors="replace"):
              m = re.match(r"\[(gw\d+)\] \[\s*\d+%\] (PASSED|FAILED|SKIPPED|XFAIL|XPASS|ERROR) (\S+)", line)
              if m:
                  done.add(m.group(3))
          coll = [l.strip() for l in open("collected.txt")]
          left = [t for t in coll if t not in done]
          print("collected", len(coll), "finished", len(done), "not finished", len(left))
          print("\n".join(left[:200]))
          EOF
            kill -9 $PID || true
            exit 1
          fi
          wait $PID; rc=$?
          tail -n 5 pytest.log
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-log-${{ matrix.copy }}
          path: pytest.log
