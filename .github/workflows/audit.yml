name: audit

# The claims in the README are checked on a machine we do not control, on every push and every day.
# There is no certification body for an agent-memory library; the closest honest substitute is a public,
# reproducible audit whose failures are as visible as its passes. If this badge is red, believe the badge.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"        # daily, so a claim that rots is caught without a push
  workflow_dispatch:

jobs:
  claims:
    name: README claims (working tree)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: claims_audit
        run: python claims_audit.py --local
      # A STATUS MUST BE EARNED BY A RUN. Every REPRODUCIBLE row used to carry a status a human typed
      # into a constant, and BROKEN-COMMAND only checked that the named file EXISTS. @mioimotoai-lgtm
      # found the gap from outside: the command five rows cite died on a hardcoded path before
      # argparse, while the table certified them REPRODUCIBLE-WITH-DEPS -- a promise about
      # dependencies that no dependency could have kept. This step executes each cited script's
      # module level from a foreign directory with no key, so the certification is produced rather
      # than asserted. Restoring the original defect makes it fail on three scripts, not one, because
      # two more import the first.
      - name: every REPRODUCIBLE status is earned by a run, not asserted
        run: python claims_audit.py --local --numbers --verify-commands
      - name: governance_audit
        run: python governance_audit.py --local

  falsification:
    name: the audit can actually fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # An audit that cannot fail proves nothing. Disable the erasure and require the governance audit
      # to REPORT THE CLAIM BROKEN; a green run here would mean the checks measure nothing.
      - name: governance audit must fail when erasure is skipped
        run: |
          if GOV_FALSIFY=1 python governance_audit.py --local --repeats 1; then
            echo "::error::falsification control PASSED — the audit cannot fail, so it proves nothing"
            exit 1
          else
            echo "falsification control correctly reported CLAIM BROKEN"
          fi

  surface-conformance:
    # Two releases shipped erasure defects that 1600 library tests could not see, because the tests call
    # Inspeximus(...) and the product is used through an MCP server and a CLI. This job asks the only
    # question that would have caught them: does the product still honour its own documentation through
    # the interface a user actually has? It runs anyway inside `pytest tests/` -- it is named here so the
    # answer is legible rather than buried in 1600 anonymous dots.
    name: the documented guarantees, through the surface a user has
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the MCP extra
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist cryptography pyyaml
          pip install -e ".[mcp]"
      - name: README + docs/AI_ACT.md guarantees, exercised through MCP and the CLI
        run: python -m pytest tests/test_surface_conformance.py -q -rs
      # A conformance suite that cannot fail proves nothing. Sever the derived-lineage cascade -- the
      # Art.17 guarantee docs/AI_ACT.md advertises -- and require the suite to notice through BOTH
      # surfaces.
      #
      # It took three attempts to aim this, and the first two are why the control exists. Severing
      # `_narrow_to_subject`'s call in erasure_audit left all 13 green; so did severing the forward
      # closure at the top of forget_subject, which turns out to be the DRY-RUN preview's copy. The erase
      # path runs through the resolver's own closure, and only cutting that one moves anything. A control
      # aimed at the wrong line reports a suite with teeth when the suite has none -- which is exactly the
      # class of defect this job is here to catch, committed against the job itself.
      - name: the suite must fail when a guarantee is broken
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path("inspeximus/core.py")
          s = p.read_text(encoding="utf-8")
          # Indentation lives INSIDE the quotes, one line per entry. The previous version was a
          # triple-quoted block whose continuation lines relied on a .replace() to re-add indentation
          # -- but a YAML block scalar has already stripped the common indent by the time Python sees
          # it, so there was nothing to replace and the target came out with line 1 indented and the
          # rest flush left. It could never match, and the audit job was red for exactly that. The
          # assert below is what caught it: the control working as designed, on itself.
          old = chr(10).join([
              '        keep, frontier = set(roots), set(roots)',
              '        while frontier:',
              '            nxt = {r["id"] for r in self.items',
              '                   if r["id"] not in keep and (set(r.get("derived_from") or []) & frontier)}',
              '            keep |= nxt',
              '            frontier = nxt',
              '        keep |= inherited',
          ])
          assert s.count(old) == 1, f"falsification target appears {s.count(old)}x -- the control is aimed at nothing"
          p.write_text(s.replace(old, "        keep = set(roots) | inherited", 1), encoding="utf-8")
          PY
          if python -m pytest tests/test_surface_conformance.py -q; then
            echo "::error::falsification control PASSED — the conformance suite cannot fail, so it proves nothing"
            exit 1
          else
            echo "falsification control correctly reported the broken guarantee"
          fi

  basestore-parity:
    name: InspeximusStore vs LangGraph's own store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade langgraph langgraph-checkpoint-conformance pytest pytest-xdist
      # "Drop-in BaseStore" is only true if a caller cannot tell the difference, so the same operation
      # scripts run against langgraph's InMemoryStore and against ours, and the results must match.
      - name: LangGraph's own checkpointer conformance suite (their docs say run it in CI)
        run: python checkpointer_conformance.py
      - run: python store_audit.py
      # the compliance surface must come off the framework object itself (mixin present, store not shadowed)
      - run: python -m pytest tests/test_governance_mixin.py -q
      - name: parity check must fail when writes are swallowed
        run: |
          if STORE_FALSIFY=1 python store_audit.py --repeats 1; then
            echo "::error::falsification control PASSED — the parity comparison proves nothing"
            exit 1
          fi

  adk-parity:
    name: InspeximusMemoryService vs ADK's own memory service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade google-adk pytest pytest-xdist
      # ADK ships no conformance suite for BaseMemoryService, so the "drop-in" claim rests entirely on
      # this comparison against their own InMemoryMemoryService.
      - run: python adk_audit.py
      - run: python -m pytest tests/test_google_adk.py tests/test_governance_mixin.py -q
      - name: parity check must fail when ingestion is swallowed
        run: |
          if ADK_FALSIFY=1 python adk_audit.py --repeats 1; then
            echo "::error::falsification control PASSED — the parity comparison proves nothing"
            exit 1
          fi

  session-parity:
    name: InspeximusSession vs the Agents SDK's own session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade openai-agents pytest pytest-xdist
      - run: python session_audit.py
      - run: python -m pytest tests/test_governance_mixin.py -q
      - name: parity check must fail when writes are swallowed
        run: |
          if SESSION_FALSIFY=1 python session_audit.py --repeats 1; then
            echo "::error::falsification control PASSED — the parity comparison proves nothing"
            exit 1
          fi

  optional-adapters:
    name: adapters whose tests otherwise run in NO environment
    runs-on: ubuntu-latest
    # tests/test_governance_mixin.py skips crewai and llama_index when the dependency is absent, and no job
    # installed either — so those skips were permanent and the adapters were covered nowhere. A skip that is
    # never un-skipped is an untested code path with a green tick next to it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pytest pytest-xdist crewai llama-index-core
      - run: python -m pytest tests/test_governance_mixin.py tests/test_surfaces_consistency.py -q

  haystack-parity:
    name: InspeximusDocumentStore vs Haystack's own document store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade haystack-ai pytest pytest-xdist
      - run: python haystack_audit.py
      # tests/test_haystack.py skips locally (haystack-ai is optional) and this job used to run only
      # test_governance_mixin.py — so all 9 haystack tests, including the one asserting a delete removes the
      # value FROM DISK, executed in no environment at all. A test that runs nowhere is not a test.
      - run: python -m pytest tests/test_haystack.py tests/test_governance_mixin.py -q
      - name: parity check must fail when writes are swallowed
        run: |
          if HAYSTACK_FALSIFY=1 python haystack_audit.py --repeats 1; then
            echo "::error::falsification control PASSED — the parity comparison proves nothing"
            exit 1
          fi

  published:
    name: the PUBLISHED wheel from PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Audits the artifact users actually install, not the source in this repo.
      - name: claims_audit against PyPI
        run: python claims_audit.py | tee claims_report.txt
      - name: governance_audit against PyPI
        run: python governance_audit.py | tee governance_report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: |
            claims_report.txt
            governance_report.txt
