[pytest]
# PARALLEL BY DEFAULT. 24 logical CPUs here, and three serial full runs on 2026-08-12 cost 24m38s
# each -- 74 minutes in one morning -- while pytest-xdist was installed the whole time. A rule you
# have to remember is a rule you break; this makes the fast path the default and serial the explicit
# choice (`-n 0` -- NOT `-p no:xdist`, which disables the plugin while addopts still passes it
# -n and --dist, so pytest dies on unrecognized arguments). Measured: 24m38s -> 10m20s.
#
# loadgroup, not the default scheduler: two tests execute the same probe, which writes one shared
# result file. Without grouping they raced and produced 1 failure + 4 errors that never occur
# serially -- a faster suite that changes its own answer is not a faster suite.
# CARVE-OUT, deliberate. tests/test_mutation_check_harness.py, test_mutation_restore_is_byte_exact.py
# and test_claims_audit_mutation_score.py drive a harness that EDITS SOURCE FILES IN PLACE and restores
# them. Under xdist one worker mutates inspeximus/core.py while eleven others import it -- measured as a
# parallel-only failure of test_the_committed_spec_is_not_empty_and_names_real_targets, which passes
# alone. A marker is not enough: grouping stops them fighting EACH OTHER, not the rest of the suite
# reading a mutated tree. So they are deselected from the default parallel run and have their own
# serial target. A fast suite that mutates the code the other workers are testing is not a suite.
#
#   parallel (default) : pytest tests/
#   the mutation set   : pytest tests/ -n 0 -m mutation
addopts = -n auto --dist loadgroup -m "not mutation"
markers =
    xdist_group: pin tests that share an on-disk artifact to a single worker
    mutation: drives the in-place source-mutation harness; NEVER run under xdist
