services:
  witness:
    secrets: [witness_secret]
    command: ["--secret-file", "/run/secrets/witness_secret"]
  scitt:
    secrets: [service_secret]
    # THE SECOND LOG, origin dancenitra.github.io/inspeximus-log, from 2026-09-23. The first one,
    # origin 92.5.74.17.sslip.io/log, is frozen at 10 entries in /srv/scitt-data and stays readable
    # on the Pages mirror under /log/. Its last signed checkpoint is in this log's entry 0, through
    # the policy notes, so the handover sits under every root this log signs.
    #
    # A NEW FILE NAME, not only a new directory. The service derives its witness id from the log's
    # path inside the container, and the witness remembers the old log at size 10; the same path
    # would read to it as a rollback to size 1 and it would refuse to cosign.
    volumes:
      - /srv/scitt-data-v2:/data
      - /etc/inspeximus/succession.json:/run/succession.json:ro
    command:
      - --log
      - /data/registrations-v2.log
      - --secret-file
      - /run/secrets/service_secret
      - --accept-any-issuer
      - --policy-name
      - inspeximus-log-v2
      - --policy-notes-file
      - /run/succession.json
      - --witness
      - http://witness:9810
  # NO CADDY SINCE 2026-09-23. The host serves nothing to the internet: the public log is the
  # Pages mirror (DanceNitra/inspeximus-log), which republishes a snapshot only after its workflow
  # verifies it. The container was stopped with restart=no; the Caddyfile stays for the record.
secrets:
  service_secret:
    file: /etc/inspeximus/service.secret
  witness_secret:
    file: /etc/inspeximus/witness.secret
