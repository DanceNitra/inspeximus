services:
  witness:
    secrets: [witness_secret]
    command: ["--secret-file", "/run/secrets/witness_secret"]
  scitt:
    secrets: [service_secret]
    volumes:
      - /srv/scitt-data:/data
    command:
      - --secret-file
      - /run/secrets/service_secret
      - --accept-any-issuer
      - --policy-name
      - inspeximus-log-frankfurt
      - --witness
      - http://witness:9810
  caddy:
    # PINNED TO A DIGEST, not to the moving `caddy:2` tag. A `docker compose pull` against a tag
    # replaces the binary that terminates TLS for our public log with whatever upstream has
    # published, with no review and no record of what changed. Read the digest back with
    # `docker inspect caddy:2 --format '{{json .RepoDigests}}'` before changing this line.
    image: caddy:2@sha256:14a9c00d4e833ebc2b65d36515b37bde3b73f0b323a2663aaafc88953d8c4e3f
    restart: unless-stopped
    ports: ["443:443", "80:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/static-log:/srv/static-log:ro
      # The public mirror. Read-only into the container: the web server serves it and the
      # cron job on the host is the only writer.
      - /srv/mirror:/srv/mirror:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [scitt]
secrets:
  service_secret:
    file: /etc/inspeximus/service.secret
  witness_secret:
    file: /etc/inspeximus/witness.secret
volumes:
  caddy-data:
  caddy-config:
